name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./native-host
      - run: python -m unittest discover -s native-host/tests -t native-host
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python tools/service_integration.py
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ./native-host
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run lint
        env:
          NO_UPDATE_NOTIFIER: '1'
      - run: npm run test:integration
      - run: npm run build && python tools/package_release.py
        env:
          NO_UPDATE_NOTIFIER: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-extension-and-source
          path: dist/*
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: choco install ffmpeg --no-progress -y
      - run: ./native-host/build_windows.ps1
      - run: python tools/service_integration.py "${{ github.workspace }}/dist/windows/ytdlp-host.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-companion
          path: dist/ytdlp-host-windows.zip
